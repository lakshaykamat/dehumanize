<!doctype html>
<html lang="en" class="h-full bg-[#0b0d10]">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Detector{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular'],
          },
          colors: {
            ink: {
              950: '#0b0d10',
              900: '#111418',
              850: '#171a1f',
              800: '#1f242b',
              700: '#2a313a',
              500: '#6b7480',
              300: '#c2c8d1',
              100: '#e8ecf1',
            },
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-feature-settings: "cv11", "ss01", "ss03"; }
    .field {
      @apply w-full rounded-md bg-ink-900 border border-ink-800 focus:border-ink-500 focus:ring-0 outline-none px-3 py-2 text-sm text-ink-100 placeholder-ink-500/70 transition;
    }
  </style>
</head>
<body class="h-full text-ink-100 antialiased font-sans">
  <div class="min-h-full flex flex-col">
    <header class="border-b border-ink-800/80">
      <div class="mx-auto max-w-3xl px-6 h-14 flex items-center justify-between">
        <a href="/humanize" class="text-sm font-semibold tracking-tight text-ink-100">
          AI Detector
        </a>
        <nav class="flex items-center gap-1 text-sm">
          {% set active = active_tab|default('') %}
          <a href="/humanize"
             class="px-3 py-1.5 rounded-md transition {% if active == 'humanize' %}bg-ink-850 text-ink-100{% else %}text-ink-500 hover:text-ink-100{% endif %}">
            Humanize
          </a>
          <a href="/assignment"
             class="px-3 py-1.5 rounded-md transition {% if active == 'assignment' %}bg-ink-850 text-ink-100{% else %}text-ink-500 hover:text-ink-100{% endif %}">
            Assignment
          </a>
        </nav>
      </div>
    </header>

    <main class="flex-1 mx-auto w-full max-w-3xl px-6 py-10">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
